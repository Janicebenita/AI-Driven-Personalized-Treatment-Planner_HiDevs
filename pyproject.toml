[tool.ruff]
target-version = "py312"
line-length = 110
exclude = [".venv", ".runtime", ".careweave"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "BLE", "PLW1510"]

[tool.coverage.run]
branch = true
source = ["rag", "deploy"]

[tool.coverage.report]
show_missing = true
# The ingestion CLI is covered by tests; model-cache build script is verified by container CI.
fail_under = 75

[tool.coverage.xml]
output = "artifacts/coverage.xml"
